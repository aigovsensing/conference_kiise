name: Update DBLP publication counts

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_publications.py"
      - ".github/workflows/update-publications.yml"
  schedule:
    - cron: "30 18 1 * *" # 매월 2일 03:30 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch DBLP conference publication counts
        run: python3 scripts/update_publications.py
      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No publication-count changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json docs/assets/publications.js
          git commit -m "data: refresh DBLP publication counts"
          git push
